name: Release Package

on:
  workflow_dispatch:
    inputs:
      skip_desktop_checks:
        description: Reuse reviewed desktop results; package integrity checks still run
        required: false
        type: boolean
        default: false
      desktop_skip_reason:
        description: Tested source, completion time, frameworks, counts and evidence
        required: false
        type: string
      validation_commit:
        description: Reuse recent CI from an ancestor SHA with only docs or release-automation changes
        required: false
        type: string
      version:
        description: Prepared three-part release version
        required: true
        type: string
      publish:
        description: Promote a successful, hardware-validated staging run without rebuilding
        default: false
        type: boolean
      staged_run_id:
        description: Successful preparation run to promote
        type: string
      skip_hardware_checks:
        description: Publish without hardware validation when the processor or local runner is unavailable
        required: false
        type: boolean
        default: false
      hardware_skip_reason:
        description: Reason for skipping hardware checks (required when selected)
        required: false
        type: string

permissions:
  actions: read
  checks: read
  contents: write

concurrency:
  group: public-release
  cancel-in-progress: false
  queue: max

jobs:
  build-and-upload-package:
    if: ${{ !inputs.publish }}
    runs-on: windows-latest
    env:
      MANIFESTUTIL_VERSION: 29.0.10
      OFFICE_CORE_VERSION: 12.0.0
      WORD_INTEROP_VERSION: 15.0.4797.1004
      NET472_REFERENCE_ASSEMBLIES: C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.7.2
      NETFX_RUNTIME_DIR: C:\Windows\Microsoft.NET\Framework64\v4.0.30319
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify configured release checks
        shell: pwsh
        working-directory: ${{ github.workspace }}/.
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_RELEASE_CHECKS: ${{ inputs.skip_desktop_checks && vars.RELEASE_REQUIRED_CHECKS || '[{"context":"tests","appId":15368}]' }}
          REQUIRED_HOSTED_WORKFLOWS: '["tests.yml","workflow-discovery.yml"]'
          RELEASE_SKIP_HARDWARE_CHECKS: ${{ inputs.skip_hardware_checks }}
          RELEASE_HARDWARE_SKIP_REASON: ${{ inputs.hardware_skip_reason }}
        run: |
          Write-Output 'Configured checks are verified by the following shared-policy action.'
      - name: Verify shared release policy
        uses: oznetmaster/CrestronHomeNUnit/.github/actions/release-validation@2ae8197c6685099c2133e7bb962d1f3568aae9c3
        with:
          # Preparation only stages immutable files. Hardware remains mandatory at promotion.
          required-checks: ${{ inputs.skip_desktop_checks && vars.RELEASE_REQUIRED_CHECKS || '[{"context":"tests","appId":15368}]' }}
          hosted-workflows: "[\"tests.yml\",\"workflow-discovery.yml\"]"
          skip-hardware-checks: "${{ inputs.skip_hardware_checks }}"
          hardware-skip-reason: "${{ inputs.hardware_skip_reason }}"
          skip-desktop-checks: "${{ inputs.skip_desktop_checks }}"
          desktop-skip-reason: "${{ inputs.desktop_skip_reason }}"
          validation-commit: "${{ inputs.validation_commit }}"
      - name: Check out processor test SDK
        uses: actions/checkout@v4
        with:
          repository: oznetmaster/CrestronHomeNUnit
          ref: 26694de80a966a362d7afe661d64399b395ff194
          path: .processor-sdk

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install ILRepack tool
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ilrepack --version 2.0.45
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install ManifestUtil package
        shell: pwsh
        run: |
          nuget install Crestron.DeviceDrivers.ManifestUtil -Version $env:MANIFESTUTIL_VERSION -OutputDirectory "$env:RUNNER_TEMP\nuget-tools"

      - name: Install Word interop package
        shell: pwsh
        run: |
          nuget install Microsoft.Office.Interop.Word -Version $env:WORD_INTEROP_VERSION -OutputDirectory "$env:RUNNER_TEMP\nuget-tools"

      - name: Install Office core package
        shell: pwsh
        run: |
          nuget install Microsoft.Office.Core -Version $env:OFFICE_CORE_VERSION -OutputDirectory "$env:RUNNER_TEMP\nuget-tools"

      - name: Resolve ManifestUtil path
        id: manifestutil
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP "nuget-tools\Crestron.DeviceDrivers.ManifestUtil.$env:MANIFESTUTIL_VERSION"
          $manifestUtil = Get-ChildItem -Path $toolRoot -Filter ManifestUtil.exe -Recurse | Select-Object -First 1
          if ($null -eq $manifestUtil) {
            throw "ManifestUtil.exe was not found under $toolRoot"
          }

          $wordInteropRoot = Join-Path $env:RUNNER_TEMP "nuget-tools\Microsoft.Office.Interop.Word.$env:WORD_INTEROP_VERSION"
          $wordInterop = Get-ChildItem -Path $wordInteropRoot -Filter Microsoft.Office.Interop.Word.dll -Recurse | Select-Object -First 1
          if ($null -eq $wordInterop) {
            throw "Microsoft.Office.Interop.Word.dll was not found under $wordInteropRoot"
          }

          $officeCoreRoot = Join-Path $env:RUNNER_TEMP "nuget-tools\Microsoft.Office.Core.$env:OFFICE_CORE_VERSION"
          $officeCore = Get-ChildItem -Path $officeCoreRoot -Filter office.dll -Recurse | Select-Object -First 1
          if ($null -eq $officeCore) {
            throw "office.dll was not found under $officeCoreRoot"
          }

          Copy-Item $wordInterop.FullName (Join-Path $manifestUtil.Directory.FullName 'Microsoft.Office.Interop.Word.dll') -Force
          Copy-Item $officeCore.FullName (Join-Path $manifestUtil.Directory.FullName 'office.dll') -Force

          $manifestUtilConfig = @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <runtime>
              <assemblyBinding xmlns="urn:schemas-microsoft-com:asm.v1">
                <dependentAssembly>
                  <assemblyIdentity name="office" publicKeyToken="71e9bce111e9429c" culture="neutral" />
                  <bindingRedirect oldVersion="0.0.0.0-15.0.0.0" newVersion="12.0.0.0" />
                </dependentAssembly>
              </assemblyBinding>
            </runtime>
          </configuration>
          '@
          Set-Content -Path (Join-Path $manifestUtil.Directory.FullName 'ManifestUtil.exe.config') -Value $manifestUtilConfig -Encoding UTF8

          "exe_path=$($manifestUtil.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore dependencies
        run: dotnet restore TeslaPowerwallCrestronDriver/TeslaPowerwallCrestronDriver.csproj

      - name: Write release notes
        id: release_notes
        shell: pwsh
        run: |
          if ((Get-Content RELEASE-NOTES.md -TotalCount 1) -cne ('# TeslaPowerwallCrestronDriver ' + '${{ inputs.version }}')) { throw 'Release notes/version mismatch.' }
          $expectedHeading = '## [' + '${{ inputs.version }}' + '](https://github.com/' + $env:GITHUB_REPOSITORY + '/releases/tag/v' + '${{ inputs.version }}' + ')'
          if ((Get-Content CHANGELOG.md -Raw) -cnotmatch ('(?m)^' + [regex]::Escape($expectedHeading) + '(?=\s|$)')) { throw 'The changelog version must link to this exact GitHub release before assets are frozen.' }
          Copy-Item RELEASE-NOTES.md "$env:RUNNER_TEMP/release-notes.txt"
          "path=$env:RUNNER_TEMP/release-notes.txt" >> $env:GITHUB_OUTPUT

      - name: Verify driver version rules
        shell: pwsh
        run: ./tools/Test-DriverVersioning.ps1

      - name: Determine release version
        id: package_version
        shell: pwsh
        run: |
          $selected = & ./tools/Get-DriverReleaseVersion.ps1 -ManifestPath @('./TeslaPowerwallCrestronDriver/TeslaPowerwallCrestronDriver.json') -Tag ('v' + '${{ inputs.version }}') -RequireTag
          "value=$($selected.PackageVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "driver=$($selected.DriverReleaseVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$($selected.Tag)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build release package
        shell: pwsh
        run: |
          dotnet build TeslaPowerwallCrestronDriver/TeslaPowerwallCrestronDriver.csproj -c Release -p:ManifestUtilExe="${{ steps.manifestutil.outputs.exe_path }}" -p:LocalNet472ReferenceAssemblies="$env:NET472_REFERENCE_ASSEMBLIES" -p:LocalNetFxRuntimeDir="$env:NETFX_RUNTIME_DIR" -p:MergeDependenciesContinueOnError=false -p:PackageDriverContinueOnError=false -p:PackageDriverIgnoreExitCode=false -p:DriverReleaseVersion="${{ steps.package_version.outputs.driver }}"

      - name: Locate package
        id: package
        shell: pwsh
        run: |
          $pkg = Get-Item -LiteralPath "$env:GITHUB_WORKSPACE\TeslaPowerwallCrestronDriver\bin\Release\net472\TeslaPowerwallCrestronDriver.pkg" -ErrorAction Stop
          if ($null -eq $pkg) {
            throw 'No .pkg file was generated in TeslaPowerwallCrestronDriver/bin/Release.'
          }

          # Use the pinned SDK helper before any hash, NuGet wrapping or hardware validation.
          & ./.processor-sdk/CrestronHomeNUnit.Driver/FixPkgPathSeparators.ps1 -PkgPath $pkg.FullName

          & ./tools/Assert-DriverPackageVersion.ps1 -PackagePath $pkg.FullName -ManifestPath './TeslaPowerwallCrestronDriver/TeslaPowerwallCrestronDriver.json' -ReleaseVersion '${{ steps.package_version.outputs.value }}'

          "pkg_path=$($pkg.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8


      - name: Build processor test release asset
        shell: pwsh
        run: |
          dotnet build TeslaPowerwallCrestronDriver.ProcessorTests/TeslaPowerwallCrestronDriver.ProcessorTests.csproj -c Release -p:BuildProcessorTestPackages=true "-p:ProcessorTestSdkRoot=$env:GITHUB_WORKSPACE/.processor-sdk" -p:ReleaseVersion=${{ steps.package_version.outputs.value }} -p:DeployAfterBuild=false "-p:ManifestUtilExe=${{ steps.manifestutil.outputs.exe_path }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare processor test documentation and source identity
        shell: pwsh
        run: |
          $docs = Join-Path $env:RUNNER_TEMP 'processor-release-docs'
          New-Item -ItemType Directory -Path $docs -Force | Out-Null
          Copy-Item README.md,CHANGELOG.md,LICENSE -Destination $docs
          $tests = 'TeslaPowerwallCrestronDriver.ProcessorTests'
          Copy-Item "$tests/RELEASE-NOTES.md","$tests/THIRD-PARTY-NOTICES.md" -Destination $docs
          Copy-Item "$tests/README.md" -Destination "$docs/PROCESSOR-TESTS.md"
          Copy-Item "TeslaPowerwallCrestronDriver.Tests/README.md" -Destination "$docs/LIVE-TESTS.md"
          Copy-Item "TeslaPowerwallCrestronDriver.LocalSetup/README.md" -Destination "$docs/LOCAL-PROVISIONING.md"
          Copy-Item "$tests/licenses" -Destination $docs -Recurse
          Compress-Archive -Path "$docs/*" -DestinationPath "$tests/TeslaPowerwallCrestronDriver.ProcessorTests-Documentation.zip"
          @{
            repository = '${{ github.repository }}'
            commit = '${{ github.sha }}'
            release = '${{ steps.package_version.outputs.tag }}'
            testHostRepository = 'oznetmaster/CrestronHomeNUnit'
            testHostCommit = '26694de80a966a362d7afe661d64399b395ff194'
          } | ConvertTo-Json | Set-Content "$tests/TeslaPowerwallCrestronDriver.ProcessorTests.sources.json"
          $assets = @("$tests/bin/Release/net472/TeslaPowerwallCrestronDriver.ProcessorTests.pkg", "$tests/TeslaPowerwallCrestronDriver.ProcessorTests-Documentation.zip", "$tests/TeslaPowerwallCrestronDriver.ProcessorTests.sources.json")
          $assets | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_ -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_))"
          } | Set-Content "$tests/PROCESSOR-TESTS-SHA256SUMS.txt"

      - name: Build independent local provisioning download
        shell: pwsh
        run: ./tools/Build-LocalSetupRelease.ps1 -OutputDirectory "$env:RUNNER_TEMP/local-provisioning-release"

      - name: Record product checksums
        shell: pwsh
        run: |
          $assets = @('${{ steps.package.outputs.pkg_path }}', "$env:RUNNER_TEMP/local-provisioning-release/TeslaPowerwallLocalSetup-win-x64.zip")
          $assets | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_ -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_))"
          } | Set-Content "$env:RUNNER_TEMP/PRODUCT-SHA256SUMS.txt"

      - name: Pack NuGet package
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP 'nuget-package'
          $manifestPath = Join-Path $env:RUNNER_TEMP 'crestron-driver-package.json'
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          $manifest = @{
            standardVersion = '1.0'
            packageType = 'CrestronHomeDriver'
            driverPlatform = 'Crestron Home'
            payloadType = 'pkg'
            payloadFile = [System.IO.Path]::GetFileName("${{ steps.package.outputs.pkg_path }}")
            containsManagedDllPayload = $false
            packageId = 'CrestronHomeDriver.Tesla.Powerwall'
            packageVersion = "${{ steps.package_version.outputs.value }}"
            displayName = 'Tesla Powerwall Driver'
            vendor = 'Tesla'
            driverCategory = 'Energy Automation'
          } | ConvertTo-Json -Depth 5

          Set-Content -Path $manifestPath -Value $manifest -Encoding UTF8

          dotnet pack TeslaPowerwallCrestronDriver/TeslaPowerwallCrestronDriver.csproj -c Release --no-build --output $outputDir -p:PackageVersion="${{ steps.package_version.outputs.value }}" -p:PackageDriverPkgPath="${{ steps.package.outputs.pkg_path }}" -p:PackageDriverManifestPath="$manifestPath" -p:PackageReleaseNotesFile="${{ steps.release_notes.outputs.path }}"

      - name: Locate NuGet package
        id: nuget_package
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP 'nuget-package') -Filter *.nupkg -File |
            Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if ($null -eq $nupkg) {
            throw 'No NuGet package (.nupkg) was generated.'
          }

          "nupkg_path=$($nupkg.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Stage immutable release assets
        shell: pwsh
        run: |
          $destination = 'artifacts/release'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $paths = @(
            '${{ steps.package.outputs.pkg_path }}',
            '${{ steps.nuget_package.outputs.nupkg_path }}',
            "$env:RUNNER_TEMP/local-provisioning-release/TeslaPowerwallLocalSetup-win-x64.zip",
            "$env:RUNNER_TEMP/PRODUCT-SHA256SUMS.txt",
            'TeslaPowerwallCrestronDriver.ProcessorTests/bin/Release/net472/TeslaPowerwallCrestronDriver.ProcessorTests.pkg',
            'TeslaPowerwallCrestronDriver.ProcessorTests/TeslaPowerwallCrestronDriver.ProcessorTests-Documentation.zip',
            'TeslaPowerwallCrestronDriver.ProcessorTests/TeslaPowerwallCrestronDriver.ProcessorTests.sources.json',
            'TeslaPowerwallCrestronDriver.ProcessorTests/PROCESSOR-TESTS-SHA256SUMS.txt'
          )
          foreach ($path in $paths) { Copy-Item -LiteralPath $path -Destination $destination -ErrorAction Stop }
          $files = @(Get-ChildItem $destination -File | ForEach-Object { @{ Name=$_.Name; Sha256=(Get-FileHash $_.FullName).Hash } })
          @{ Repository=$env:GITHUB_REPOSITORY; Commit=$env:GITHUB_SHA; Version='${{ inputs.version }}'; BuildRunId=$env:GITHUB_RUN_ID; Files=$files } | ConvertTo-Json -Depth 5 | Set-Content "$destination/StagedRelease.json"
          ./tools/Assert-StagedRelease.ps1 -Directory $destination -Version '${{ inputs.version }}' -Commit $env:GITHUB_SHA -BuildRunId $env:GITHUB_RUN_ID
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: artifacts/release/*
          if-no-files-found: error

  promote:
    if: inputs.publish
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify exact tag and preparation provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          STAGED_RUN_ID: ${{ inputs.staged_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $selected = ./tools/Get-DriverReleaseVersion.ps1 -ManifestPath TeslaPowerwallCrestronDriver/TeslaPowerwallCrestronDriver.json -Tag ('v' + $env:REQUESTED_VERSION) -RequireTag
          if ($env:GITHUB_REF_TYPE -cne 'tag' -or $env:GITHUB_REF_NAME -cne $selected.Tag) { throw 'Promote only from the exact existing release tag.' }
          if ($env:STAGED_RUN_ID -notmatch '^[0-9]+$') { throw 'A successful staging run ID is required.' }
          $head = (git rev-parse HEAD).Trim()
          $tagHead = (git rev-parse "$($selected.Tag)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $tagHead) { throw 'Release tag/source mismatch.' }
          if ((Get-Content RELEASE-NOTES.md -TotalCount 1) -cne ('# TeslaPowerwallCrestronDriver ' + $env:REQUESTED_VERSION)) { throw 'Release notes/version mismatch.' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:STAGED_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_repository.full_name -cne $env:GITHUB_REPOSITORY -or $run.head_sha -cne $head -or $run.path -cne '.github/workflows/release-package.yml' -or $run.event -cne 'workflow_dispatch' -or $run.conclusion -cne 'success') { throw 'Preparation has invalid source, workflow or outcome.' }
          $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:STAGED_RUN_ID/jobs" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($jobs.jobs | Where-Object { $_.name -ceq 'build-and-upload-package' -and $_.conclusion -ceq 'success' }).Count -ne 1) { throw 'Preparation did not build assets successfully.' }
          gh run download $env:STAGED_RUN_ID --repo $env:GITHUB_REPOSITORY --name release-assets --dir artifacts/release
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download staged release.' }
          ./tools/Assert-StagedRelease.ps1 -Directory artifacts/release -Version $env:REQUESTED_VERSION -Commit $head -BuildRunId $env:STAGED_RUN_ID
      - name: Require current source checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_RELEASE_CHECKS: ${{ vars.RELEASE_REQUIRED_CHECKS }}
          REQUIRED_HOSTED_WORKFLOWS: '["tests.yml","workflow-discovery.yml","nunit5-policy.yml"]'
        run: |
          Write-Output 'Configured checks are verified by the following shared-policy action.'
      - name: Verify shared release policy
        uses: oznetmaster/CrestronHomeNUnit/.github/actions/release-validation@2ae8197c6685099c2133e7bb962d1f3568aae9c3
        with:
          required-checks: "${{ vars.RELEASE_REQUIRED_CHECKS }}"
          hosted-workflows: "[\"tests.yml\",\"workflow-discovery.yml\",\"nunit5-policy.yml\"]"
          skip-hardware-checks: "${{ inputs.skip_hardware_checks }}"
          hardware-skip-reason: "${{ inputs.hardware_skip_reason }}"
          skip-desktop-checks: "${{ inputs.skip_desktop_checks }}"
          desktop-skip-reason: "${{ inputs.desktop_skip_reason }}"
          validation-commit: "${{ inputs.validation_commit }}"
      - name: Publish the staged NuGet distribution
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) { throw 'NUGET_API_KEY is not configured.' }
          dotnet nuget push "artifacts/release/CrestronHomeDriver.Tesla.Powerwall.${{ inputs.version }}.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet publication failed.' }
      - name: Publish the same staged assets on GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
        run: |
          $files = @(Get-ChildItem artifacts/release -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @files --verify-tag --title "TeslaPowerwallCrestronDriver ${{ inputs.version }}" --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
